server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: campus-pin-haofan
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/campus_haofan?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: zhang914
    hikari:
      pool-name: CampusHaoFanHikariPool
      maximum-pool-size: 10
      minimum-idle: 2
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 2s

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

auth:
  token:
    secret: campus-pin-haofan-local-secret
    expire-hours: 24

haofan:
  rocketmq:
    enabled: ${HAOFAN_ROCKETMQ_ENABLED:false}
    name-server: ${HAOFAN_ROCKETMQ_NAME_SERVER:localhost:9876}
    access-key: ${HAOFAN_ROCKETMQ_ACCESS_KEY:}
    secret-key: ${HAOFAN_ROCKETMQ_SECRET_KEY:}
    producer-group: ${HAOFAN_ROCKETMQ_PRODUCER_GROUP:group-order-timeout-producer-group}
    consumer-group: ${HAOFAN_ROCKETMQ_CONSUMER_GROUP:group-order-timeout-consumer-group}
    topic: ${HAOFAN_ROCKETMQ_TOPIC:group-order-timeout-topic}
    tag: ${HAOFAN_ROCKETMQ_TAG:GROUP_ORDER_TIMEOUT}